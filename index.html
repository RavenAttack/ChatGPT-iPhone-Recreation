<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iPhone iOS 26 Recreation</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scene">
      <section class="iphone" aria-label="iPhone iOS 26 home screen recreation">
        <div class="frame-shine"></div>
        <div class="screen">
          <header class="status-bar">
            <span id="time" class="status-time">9:41</span>
            <div class="island" role="img" aria-label="Dynamic island"></div>
            <div class="status-icons" aria-hidden="true">
              <span class="signal"></span>
              <span class="wifi"></span>
              <span class="battery"><span class="level"></span></span>
            </div>
          </header>

          <section class="hero-widget glass">
            <p class="widget-title">Good evening</p>
            <h1 id="date" class="widget-date">Monday, January 1</h1>
            <p class="widget-temp">Cupertino · 72° · Mostly Clear</p>
          </section>

          <section class="app-grid" aria-label="Application icons">
            <button class="app glass purple"><span>FaceTime</span></button>
            <button class="app glass blue"><span>Mail</span></button>
            <button class="app glass orange"><span>Music</span></button>
            <button class="app glass green"><span>Maps</span></button>
            <button class="app glass cyan"><span>Safari</span></button>
            <button class="app glass pink"><span>Photos</span></button>
            <button class="app glass red"><span>Health</span></button>
            <button class="app glass yellow"><span>Notes</span></button>
            <button class="app glass indigo"><span>App Store</span></button>
            <button class="app glass teal"><span>Files</span></button>
            <button class="app glass violet"><span>TV</span></button>
            <button class="app glass lime"><span>Home</span></button>
          </section>

          <footer class="dock glass" aria-label="Dock">
            <button class="dock-app"><span>Phone</span></button>
            <button class="dock-app"><span>Messages</span></button>
            <button class="dock-app"><span>Camera</span></button>
            <button class="dock-app"><span>Settings</span></button>
          </footer>

          <div class="home-indicator" aria-hidden="true"></div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
